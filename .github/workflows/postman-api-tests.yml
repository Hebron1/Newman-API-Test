name: Newman API Tests

on:
  workflow_dispatch:

jobs:
  test:
    defaults:
      run:
        working-directory: ./tests

    environment: staging
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: newman run BoredApiNewman.postman_collection.json